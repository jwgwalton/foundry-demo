[project]
name = "wella-foundry-demo-local-dependencies"
version = "0.1.0"
description = "Synthetic local APIs for the Wella Foundry demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]